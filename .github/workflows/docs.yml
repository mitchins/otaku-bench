name: Documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical==0.0.72
      # Pages caches assets for 10 min under a fixed URL; version the stylesheet per deploy so new markup never meets old CSS
      - run: sed -i "s|stylesheets/board.css\"|stylesheets/board.css?v=${GITHUB_SHA::8}\"|" zensical.toml
      - run: zensical build --clean
      - run: grep -q "board.css?v=${GITHUB_SHA::8}" site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
